<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla .EUIX Engine</title>
    <!-- Tailwind CSS (CDN for quick Demo styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Highlight.js CDN for Syntax Highlighting -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-50/70 min-h-screen py-3 px-2 sm:py-6 sm:px-4 md:px-6 flex flex-col items-center justify-start max-w-full overflow-x-hidden">
    <div id="app" class="w-full max-w-6xl xl:max-w-7xl min-w-0 overflow-hidden"></div>

    <!-- EUIX Şablonu (Auto-Init) -->
    <script type="application/euix" target="#app">
    <uid_spec id="doc_portal_app">
        <constants src="./public/data/app-tokens.json">
            <const id="card_box">w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100</const>
            <const id="btn_primary">px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-colors cursor-pointer</const>
            <const id="badge_blue">px-2.5 py-1 bg-blue-50 text-blue-700 font-semibold rounded-lg text-xs</const>
        </constants>

        <data_model src="./public/data/app-config.json">
            <state id="help_open" type="string">false</state>
            <state id="code_modal_open" type="string">false</state>
            <state id="code_modal_title" type="string"></state>
            <state id="code_modal_lines" type="string"></state>
            <state id="code_modal_content" type="string"></state>
        </data_model>

        <imports>
            <import name="doc-portal-section" src="components/DocPortalSection.xml" />
            <import name="help-modal" src="components/HelpModal.xml" />
            <import name="code-viewer-modal" src="components/CodeViewerModal.xml" />
        </imports>

        <flex direction="column" gap="20" class="w-full">
            <doc-portal-section />
            <help-modal />
            <code-viewer-modal />
        </flex>
    </uid_spec>
    </script>

    <!-- EUIX Engine & DevTools Script (Auto-Init & Inspector) -->
    <script type="module" src="./src/EUIXEngine.js"></script>
    <script type="module">
        import { EUIXEngine } from './src/EUIXEngine.js';
        import { EUIXDevTools } from './src/EUIXDevTools.js';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.EUIXEngine && window.EUIXEngine.instance) {
                const engine = window.EUIXEngine.instance;
                EUIXDevTools.init(engine);
            }
        });
    </script>
</body>

</html>
