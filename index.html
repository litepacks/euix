<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla .XUI Engine - Modular Components</title>
    <!-- Tailwind CSS stable play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom collapse arrow rotations handled cleanly */
        .xui-collapse.is-closed .xui-collapse-chevron::before { content: "▶"; }
        .xui-collapse.is-open .xui-collapse-chevron::before { content: "▼"; }
    </style>
</head>
<body class="bg-slate-50/70 min-h-screen py-12 px-4 flex flex-col items-center justify-start">
    <div id="app" class="w-full max-w-xl"></div>

    <!-- XML Şablonu (Auto-Init) -->
    <script type="application/xui" target="#app">
    <uid_spec id="todo_app">
        <data_model>
            <state id="new_todo_input" type="string"></state>
            <state id="edit_todo_input" type="string"></state>
            <state id="editing_id" type="string"></state>
            <state id="todos" type="array">
                <item id="1" text="Görev 1" completed="false" />
                <item id="2" text="Görev 2" completed="false" />
                <item id="3" text="Görev 3" completed="true" />
                <item id="4" text="Görev 4" completed="false" />
                <item id="5" text="Görev 5" completed="false" />
            </state>
            <state id="pokemons" type="array"></state>
            <state id="pokemon_loading" type="string">false</state>
            <state id="pokemon_error" type="string"></state>
            <state id="todos_open" type="string">true</state>
            <state id="pokemon_open" type="string">false</state>
            <state id="compare_open" type="string">false</state>
            <state id="events_open" type="string">false</state>
            <state id="quick_todo_input" type="string"></state>
            <state id="hover_status" type="string">Fareyi bu kutunun üzerine getirin...</state>
            <state id="help_open" type="string">false</state>
        </data_model>

        <on_mount action="XHR">
            <method>GET</method>
            <url>https://pokeapi.co/api/v2/pokemon?limit=12</url>
            <select>results</select>
            <target>data.pokemons</target>
            <loading>data.pokemon_loading</loading>
            <error>data.pokemon_error</error>
            <item_map>
                <field as="id" from="url" match="/(\d+)\/?$/" />
                <field as="name" from="name" />
                <field as="image" template="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png" />
            </item_map>
        </on_mount>

        <imports>
            <import name="user-badge" src="components/UserBadge.xml" />
            <import name="app-header" src="components/AppHeader.xml" />
            <import name="todo-section" src="components/TodoSection.xml" />
            <import name="pokemon-section" src="components/PokemonSection.xml" />
            <import name="compare-section" src="components/CompareSection.xml" />
            <import name="events-section" src="components/EventsSection.xml" />
            <import name="help-modal" src="components/HelpModal.xml" />
        </imports>

        <flex direction="column" gap="16" class="w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
            <app-header />
            <todo-section />
            <pokemon-section />
            <compare-section />
            <events-section />
            <help-modal />
        </flex>
    </uid_spec>
    </script>

    <!-- XUI Engine Script (Auto-Init otomatik tetiklenir) -->
    <script src="XUIEngine.js"></script>
</body>
</html>
