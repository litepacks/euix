<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla .EUIX Engine - Modular Components</title>
    <!-- Tailwind CSS stable play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom collapse arrow rotations handled cleanly */
        .euix-collapse.is-closed .euix-collapse-chevron::before { content: "▶"; }
        .euix-collapse.is-open .euix-collapse-chevron::before { content: "▼"; }
    </style>
</head>
<body class="bg-slate-50/70 min-h-screen py-12 px-4 flex flex-col items-center justify-start">
    <div id="app" class="w-full max-w-xl"></div>

    <!-- EUIX Şablonu (Auto-Init) -->
    <script type="application/euix" target="#app">
    <uid_spec id="todo_app">
        <data_model>
            <state id="new_todo_input" type="string"></state>
            <state id="edit_todo_input" type="string"></state>
            <state id="editing_id" type="string"></state>
            <state id="todos" type="array">
                <item id="1" text="Task 1" completed="false" />
                <item id="2" text="Task 2" completed="false" />
                <item id="3" text="Task 3" completed="true" />
                <item id="4" text="Task 4" completed="false" />
                <item id="5" text="Task 5" completed="false" />
            </state>
            <state id="pokemons" type="array"></state>
            <state id="pokemon_loading" type="string">false</state>
            <state id="pokemon_error" type="string"></state>
            <state id="todos_open" type="string">true</state>
            <state id="pokemon_open" type="string">false</state>
            <state id="compare_open" type="string">false</state>
            <state id="events_open" type="string">true</state>
            <state id="form_open" type="string">true</state>
            <state id="quick_todo_input" type="string"></state>
            <state id="hover_status" type="string">Hover over this box...</state>
            <state id="help_open" type="string">false</state>
            <state id="form_bio" type="string">Vanilla .EUIX Engine developer.</state>
            <state id="form_category" type="string">frontend</state>
            <state id="form_level" type="string">senior</state>
            <state id="form_salary" type="string">85</state>
            <state id="form_hours" type="string">40</state>
            <state id="confirm_modal_open" type="string">false</state>
            <state id="delete_modal_open" type="string">false</state>
            <state id="selected_todo_id" type="string"></state>
            <state id="counter_value" type="string">0</state>
            <state id="counter_open" type="string">true</state>
            <state id="pokemon_open" type="string">true</state>
            <state id="pokemon_loading" type="string">false</state>
            <state id="pokemon_error" type="string"></state>
            <state id="pokemons" type="array"></state>
        </data_model>

        <on_mount action="XHR">
            <method>GET</method>
            <url>https://pokeapi.co/api/v2/pokemon?limit=12</url>
            <select>results</select>
            <target>data.pokemons</target>
            <loading>data.pokemon_loading</loading>
            <error>data.pokemon_error</error>
            <item_map>
                <field as="id" from="url" match="/(\d+)\/?$/" />
                <field as="name" from="name" />
                <field as="image" template="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png" />
            </item_map>
        </on_mount>

        <imports>
            <import name="user-badge" src="components/UserBadge.xml" />
            <import name="app-header" src="components/AppHeader.xml" />
            <import name="counter-section" src="components/CounterSection.xml" />
            <import name="todo-section" src="components/TodoSection.xml" />
            <import name="pokemon-section" src="components/PokemonSection.xml" />
            <import name="compare-section" src="components/CompareSection.xml" />
            <import name="events-section" src="components/EventsSection.xml" />
            <import name="form-section" src="components/FormSection.xml" />
            <import name="confirm-modal" src="components/ConfirmModal.xml" />
            <import name="help-modal" src="components/HelpModal.xml" />
        </imports>

        <flex direction="column" gap="16" class="w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
            <app-header />
            <counter-section />
            <todo-section />
            <form-section />
            <pokemon-section />
            <compare-section />
            <events-section />
            <confirm-modal bind="data.confirm_modal_open" mode="clear" title="Clear All Tasks?" message="Are you sure you want to permanently delete all tasks?" confirm_text="Yes, Delete All" cancel_text="Cancel" />
            <confirm-modal bind="data.delete_modal_open" mode="remove" title="Delete Task?" message="Are you sure you want to remove this task?" confirm_text="Yes, Delete" cancel_text="Cancel" />
            <help-modal />
        </flex>
    </uid_spec>
    </script>

    <!-- EUIX Engine & DevTools Script (Auto-Init & Inspector) -->
    <script src="src/EUIXEngine.js"></script>
    <script type="module" src="src/EUIXDevTools.js" data-euix-devtools></script>
</body>
</html>
