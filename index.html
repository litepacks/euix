<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla .XUI Engine - Todo & Pokémon</title>
    <!-- Tailwind CSS stable play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom collapse arrow rotations handled cleanly */
        .xui-collapse.is-closed .xui-collapse-chevron::before { content: "▶"; }
        .xui-collapse.is-open .xui-collapse-chevron::before { content: "▼"; }
    </style>
</head>
<body class="bg-slate-50/70 min-h-screen py-12 px-4 flex flex-col items-center justify-start">
    <div id="app" class="w-full max-w-xl"></div>

    <!-- XML Şablonu (Auto-Init) -->
    <script type="application/xui" target="#app">
    <uid_spec id="todo_app">
        <data_model>
            <state id="new_todo_input" type="string"></state>
            <state id="edit_todo_input" type="string"></state>
            <state id="editing_id" type="string"></state>
            <state id="todos" type="array">
                <item id="1" text="Görev 1" completed="false" />
                <item id="2" text="Görev 2" completed="false" />
                <item id="3" text="Görev 3" completed="true" />
                <item id="4" text="Görev 4" completed="false" />
                <item id="5" text="Görev 5" completed="false" />
            </state>
            <state id="pokemons" type="array"></state>
            <state id="pokemon_loading" type="string">false</state>
            <state id="pokemon_error" type="string"></state>
            <state id="todos_open" type="string">true</state>
            <state id="pokemon_open" type="string">false</state>
            <state id="compare_open" type="string">false</state>
            <state id="events_open" type="string">false</state>
            <state id="quick_todo_input" type="string"></state>
            <state id="hover_status" type="string">Fareyi bu kutunun üzerine getirin...</state>
            <state id="help_open" type="string">false</state>
        </data_model>

        <on_mount action="XHR">
            <method>GET</method>
            <url>https://pokeapi.co/api/v2/pokemon?limit=12</url>
            <select>results</select>
            <target>data.pokemons</target>
            <loading>data.pokemon_loading</loading>
            <error>data.pokemon_error</error>
            <item_map>
                <field as="id" from="url" match="/(\\d+)/?$" />
                <field as="name" from="name" />
                <field as="image" template="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png" />
            </item_map>
        </on_mount>

        <flex direction="column" gap="16" class="w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
            <flex direction="row" align="center" justify="between" class="border-b border-slate-100 pb-4">
                <component type="title" class="text-xl font-black text-slate-800 tracking-tight">Çalışan Vanilla .XUI</component>
                <component type="button" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition-all shadow-sm">
                    <label>Hakkında</label>
                    <on_click action="SET_STATE">
                        <path>data.help_open</path>
                        <value>true</value>
                    </on_click>
                </component>
            </flex>

            <flex direction="row" align="center" gap="8" class="mt-2">
                <component type="text_input" bind="data.new_todo_input" placeholder="Yeni görev yazın..." class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm" />
                <component type="button" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-colors shadow-lg shadow-blue-500/10 cursor-pointer">
                    <label>Ekle</label>
                    <on_click action="MUTATE_STATE">
                        <path>data.todos</path>
                        <operation>PUSH</operation>
                        <value>
                            <item text="{data.new_todo_input}" />
                        </value>
                    </on_click>
                </component>
                <component type="button" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition-colors shadow-lg shadow-emerald-500/10 cursor-pointer">
                    <label>Tümünü Tamamla</label>
                    <on_click action="MUTATE_STATE">
                        <path>data.todos</path>
                        <operation>UPDATE</operation>
                        <where field="completed" op="eq" equals="false" />
                        <fields completed="true" />
                    </on_click>
                </component>
            </flex>
            
            <component type="text" class="text-xs text-slate-400 font-medium px-1 -mt-2" bind="data.new_todo_input">
                <template>Canlı önizleme: <strong>{value}</strong></template>
            </component>

            <collapse bind="data.todos_open" title="Todo Listesi" class="border border-slate-200/80 rounded-xl overflow-hidden shadow-sm" header_class="w-full flex items-center justify-between p-4 bg-slate-50/70 border-none font-bold text-slate-700 hover:bg-slate-50 cursor-pointer text-sm" body_class="p-4 flex flex-col gap-2">
                <flex direction="column" gap="8">
                    <for_each items="{data.todos}" var="todo">
                        <flex direction="row" align="center" justify="between" gap="8" class="p-3 bg-white hover:bg-slate-50/50 border border-slate-100 rounded-lg transition-all shadow-sm">
                            <if condition="{data.editing_id} == {todo.id}">
                                <component type="text_input" bind="data.edit_todo_input" placeholder="Görevi düzenle..." autofocus="true" class="flex-1 px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
                                <flex direction="row" gap="6">
                                    <component type="button" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg text-xs cursor-pointer">
                                        <label>Kaydet</label>
                                        <on_click action="MUTATE_STATE">
                                            <path>data.todos</path>
                                            <operation>UPDATE</operation>
                                            <where field="id" equals="{todo.id}" />
                                            <fields text="{data.edit_todo_input}" />
                                        </on_click>
                                    </component>
                                    <component type="button" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-lg text-xs cursor-pointer">
                                        <label>İptal</label>
                                        <on_click action="SET_STATE">
                                            <path>data.editing_id</path>
                                            <value></value>
                                        </on_click>
                                        <on_click action="SET_STATE">
                                            <path>data.edit_todo_input</path>
                                            <value></value>
                                        </on_click>
                                    </component>
                                </flex>
                                <else>
                                    <component type="checkbox" bind="todo.completed" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500/20 cursor-pointer" />
                                    <if condition="{todo.completed} == true">
                                        <component type="text" class="flex-1 text-sm text-slate-400 line-through pl-1">{todo.text}</component>
                                        <else>
                                            <component type="text" class="flex-1 text-sm text-slate-700 font-medium pl-1">{todo.text}</component>
                                        </else>
                                    </if>
                                    <flex direction="row" gap="6">
                                        <component type="button" class="px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 font-semibold rounded-lg text-xs transition-colors cursor-pointer">
                                            <label>Düzenle</label>
                                            <on_click action="SET_STATE">
                                                <path>data.editing_id</path>
                                                <value>{todo.id}</value>
                                            </on_click>
                                            <on_click action="SET_STATE">
                                                <path>data.edit_todo_input</path>
                                                <value>{todo.text}</value>
                                                <focus>data.edit_todo_input</focus>
                                            </on_click>
                                        </component>
                                        <component type="button" class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg text-xs transition-colors cursor-pointer">
                                            <label>Sil</label>
                                            <on_click action="MUTATE_STATE">
                                                <confirm condition="{todo.completed} != true">Bu görev tamamlanmadı. Silmek istediğinize emin misiniz?</confirm>
                                                <path>data.todos</path>
                                                <operation>REMOVE</operation>
                                                <where field="id" equals="{todo.id}" />
                                            </on_click>
                                        </component>
                                    </flex>
                                </else>
                            </if>
                        </flex>
                    </for_each>
                </flex>
            </collapse>

            <collapse bind="data.pokemon_open" class="border border-slate-200/80 rounded-xl overflow-hidden shadow-sm" header_class="w-full flex items-center justify-between p-4 bg-slate-50/70 border-none font-bold text-slate-700 hover:bg-slate-50 cursor-pointer text-sm" body_class="p-4 flex flex-col gap-4">
                <summary>Pokémon</summary>
                <flex direction="row" align="center" gap="8">
                    <component type="button" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors shadow-sm cursor-pointer">
                        <label>Yeniden yükle</label>
                        <on_click action="XHR">
                            <method>GET</method>
                            <url>https://pokeapi.co/api/v2/pokemon?limit=12</url>
                            <select>results</select>
                            <target>data.pokemons</target>
                            <loading>data.pokemon_loading</loading>
                            <error>data.pokemon_error</error>
                            <item_map>
                                <field as="id" from="url" match="/(\\d+)/?$" />
                                <field as="name" from="name" />
                                <field as="image" template="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png" />
                            </item_map>
                        </on_click>
                    </component>
                    <if condition="{data.pokemon_loading} == true">
                        <component type="text" class="text-xs text-slate-400 font-medium animate-pulse">Yükleniyor...</component>
                    </if>
                    <if condition="{data.pokemon_error}">
                        <component type="text" class="text-xs text-rose-500 font-medium" bind="data.pokemon_error" />
                    </if>
                </flex>
                <grid cols="3" gap="10">
                    <for_each items="{data.pokemons}" var="poke">
                        <flex direction="column" align="center" gap="4" class="p-3 bg-slate-50/50 border border-slate-100 rounded-xl hover:border-blue-500/20 hover:bg-blue-50/10 hover:shadow-md transition-all">
                            <component type="image" src="{poke.image}" alt="{poke.name}" width="72" height="72" />
                            <component type="text" class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">#{poke.id}</component>
                            <component type="text" class="text-xs font-black text-slate-700 capitalize -mt-1">{poke.name}</component>
                        </flex>
                    </for_each>
                </grid>
            </collapse>

            <collapse bind="data.compare_open" class="border border-slate-200/80 rounded-xl overflow-hidden shadow-sm" header_class="w-full flex items-center justify-between p-4 bg-slate-50/70 border-none font-bold text-slate-700 hover:bg-slate-50 cursor-pointer text-sm" body_class="p-4 flex flex-col gap-3">
                <summary>React.js vs XUI Engine Karşılaştırması</summary>
                <grid cols="2" gap="8">
                    <flex direction="column" gap="4" class="p-3.5 bg-blue-50/50 border border-blue-100 rounded-xl text-xs">
                        <component type="text" class="font-black text-blue-700 text-sm">⚡ Vanilla .XUI Engine</component>
                        <component type="text" class="text-slate-600">• ~8 KB Gzip Paket Boyutu</component>
                        <component type="text" class="text-slate-600">• Sıfır Bağımlılık (0 Dependency)</component>
                        <component type="text" class="text-slate-600">• Derleyici Gerektirmez (No Build)</component>
                        <component type="text" class="text-slate-600">• İnce Taneli (Fine-Grained) DOM</component>
                    </flex>
                    <flex direction="column" gap="4" class="p-3.5 bg-slate-100/60 border border-slate-200 rounded-xl text-xs">
                        <component type="text" class="font-black text-slate-700 text-sm">⚛️ React.js</component>
                        <component type="text" class="text-slate-500">• ~45-140 KB Gzip Runtime</component>
                        <component type="text" class="text-slate-500">• react + react-dom + build araçları</component>
                        <component type="text" class="text-slate-500">• JSX Derleyicisi Zorunlu (Babel/Vite)</component>
                        <component type="text" class="text-slate-500">• Virtual DOM &amp; Bileşen Re-render</component>
                    </flex>
                </grid>
            </collapse>

            <collapse bind="data.events_open" class="border border-slate-200/80 rounded-xl overflow-hidden shadow-sm" header_class="w-full flex items-center justify-between p-4 bg-slate-50/70 border-none font-bold text-slate-700 hover:bg-slate-50 cursor-pointer text-sm" body_class="p-4 flex flex-col gap-4">
                <summary>⚡ Evrensel Olay Örnekleri (Enter &amp; Mouse Events)</summary>
                
                <!-- Örnek 1: Enter Tuşu İle Ekleme -->
                <flex direction="column" gap="6" class="p-3.5 bg-slate-50 border border-slate-100 rounded-xl">
                    <component type="text" class="text-xs font-bold text-slate-700">1. Enter Tuşuna Basarak Hızlı Ekle (event type="keyup" key="Enter"):</component>
                    <component type="text_input" bind="data.quick_todo_input" placeholder="Görevi yazıp ENTER'a basın..." class="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <event type="keyup" key="Enter" action="MUTATE_STATE">
                            <path>data.todos</path>
                            <operation>PUSH</operation>
                            <value>
                                <item text="{data.quick_todo_input}" />
                            </value>
                            <reset path="data.quick_todo_input" />
                        </event>
                    </component>
                    <component type="text" class="text-[11px] text-slate-400">Yazdıktan sonra Enter'a bastığınızda yukarıdaki Todo Listesine otomatik eklenir.</component>
                </flex>

                <!-- Örnek 2: MouseEnter / MouseLeave Olayları -->
                <flex direction="column" gap="6" class="p-3.5 bg-indigo-50/50 border border-indigo-100 rounded-xl transition-all">
                    <component type="text" class="text-xs font-bold text-indigo-900">2. Fare Hareket Olayları (event type="mouseenter" / "mouseleave"):</component>
                    <flex direction="row" align="center" justify="between" class="p-3 bg-white border border-indigo-100 rounded-lg shadow-sm">
                        <component type="text" class="text-xs font-semibold text-slate-700" bind="data.hover_status" />
                        <event type="mouseenter" action="SET_STATE">
                            <path>data.hover_status</path>
                            <value>🎉 Fare kutunun üzerinde! (mouseenter algılandı)</value>
                        </event>
                        <event type="mouseleave" action="SET_STATE">
                            <path>data.hover_status</path>
                            <value>Fare ayrıldı. (mouseleave algılandı)</value>
                        </event>
                    </flex>
                </flex>
            </collapse>

            <dialog bind="data.help_open" title="XUI Bilgilendirme" backdrop_class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all" panel_class="bg-white rounded-2xl max-w-sm w-full shadow-2xl overflow-hidden border border-slate-100" header_class="flex justify-between items-center px-5 py-4 border-b border-slate-100" body_class="p-5 flex flex-col gap-3 text-sm text-slate-600 leading-relaxed" footer_class="flex justify-end gap-2 px-5 py-3 bg-slate-50 border-t border-slate-100">
                <component type="text">Bu bir modal dialog örneğidir. Backdrop, Escape tuşu veya kapat butonuyla kapatılabilir.</component>
                <component type="text">Pencereler tamamen durum tabanlıdır: <strong>help_open = true</strong> iken görünür.</component>
                <actions>
                    <component type="button" class="px-4 py-2 bg-white hover:bg-slate-100 text-slate-600 font-bold border border-slate-200 rounded-xl text-xs transition-colors shadow-sm cursor-pointer">
                        <label>Vazgeç</label>
                        <on_click action="SET_STATE">
                            <path>data.help_open</path>
                            <value>false</value>
                        </on_click>
                    </component>
                    <component type="button" class="px-4 py-2 bg-slate-900 hover:bg-slate-850 text-white font-bold rounded-xl text-xs transition-colors shadow-sm cursor-pointer">
                        <label>Tamam</label>
                        <on_click action="SET_STATE">
                            <path>data.help_open</path>
                            <value>false</value>
                        </on_click>
                    </component>
                </actions>
            </dialog>
        </flex>
    </uid_spec>
    </script>

    <!-- XUI Engine Script (Auto-Init otomatik tetiklenir) -->
    <script src="XUIEngine.js"></script>
</body>
</html>
