<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EUIX WebMCP Tasks Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen p-8 flex flex-col items-center justify-center">
  <div id="app" class="w-full max-w-2xl"></div>

  <!-- Load EUIX Full Bundle or ESM Core + Plugins -->
  <script type="module">
    import { EUIXEngineCore } from '../../src/core/EUIXEngineCore.js';
    import { EUIXComposerPlugin } from '../../src/plugins/EUIXComposerPlugin.js';
    import { EUIXWebMCPPlugin } from '../../src/plugins/EUIXWebMCPPlugin.js';

    // Register required plugins
    EUIXEngineCore.use(EUIXComposerPlugin).use(EUIXWebMCPPlugin);

    // Mock document.modelContext if not natively present in browser for demonstration
    if (!document.modelContext) {
      console.info('[Demo Mock] Installing mock document.modelContext for WebMCP demonstration.');
      const toolsRegistry = new Map();
      document.modelContext = {
        registerTool(tool, options) {
          toolsRegistry.set(tool.name, { tool, options });
          console.log(`[WebMCP Demo] Registered tool: "${tool.name}"`, tool);
        },
        unregisterTool(name) {
          toolsRegistry.delete(name);
          console.log(`[WebMCP Demo] Unregistered tool: "${name}"`);
        },
        getTools() {
          return Array.from(toolsRegistry.values()).map(e => e.tool);
        },
        async executeTool(name, input) {
          const entry = toolsRegistry.get(name);
          if (!entry) throw new Error(`Tool not found: ${name}`);
          return await entry.tool.execute(input);
        }
      };
      window._mockWebMCP = document.modelContext;
    }

    // Fetch and mount tasks application XML
    fetch('./tasks.xml')
      .then(res => res.text())
      .then(xml => {
        const engine = EUIXEngineCore.mount(xml, '#app');
        window.euixApp = engine;
        console.log('[EUIX] Tasks app mounted successfully with WebMCP tools:', engine.webmcp.list());
      })
      .catch(err => console.error('[EUIX] Failed to load tasks.xml:', err));
  </script>
</body>
</html>
