<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EUIX Action Composer Test Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --active-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--primary);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .status-panel {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .status-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: #0284c7;
      color: #ffffff;
      font-size: 13px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      height: 42px;
      padding: 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover {
      border-color: var(--primary);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .btn.active {
      background: var(--active-gradient) !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transform: translateY(-2px);
    }

    .btn.active::after {
      content: "✓";
      font-size: 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- Declarative EUIX Application Specification -->
  <script type="application/euix" target="#app">
    <uid_spec>
      <!-- 1. State Model -->
      <data_model>
        <state id="active_country">TR</state>
        <state id="status_text">Selected Turkey (Initial State)</state>
        <state id="click_count">0</state>
      </data_model>

      <!-- 2. Reusable Action Subroutines (Action Composer) -->
      <actions>
        <action_def name="SelectCountryWorkflow">
          <param name="code" required="true" />
          <param name="name" required="true" />

          <!-- Step 1: Update active_country -->
          <step action="SET_STATE">
            <path>data.active_country</path>
            <value>{args.code}</value>
          </step>

          <!-- Step 2: Update status text -->
          <step action="SET_STATE">
            <path>data.status_text</path>
            <value>Active Country changed to {args.name} ({args.code})</value>
          </step>

          <!-- Step 3: Increment total clicks -->
          <step action="SET_STATE">
            <path>data.click_count</path>
            <value>{data.click_count} + 1</value>
          </step>
        </action_def>
      </actions>

      <!-- 3. UI Layout -->
      <div class="container">
        <h1>⚡ EUIX Action Composer Demo</h1>
        <p class="subtitle">Testing reusable &lt;action_def&gt; subroutines with declarative &lt;arg&gt; arguments.</p>

        <!-- Reactive State Monitor -->
        <div class="status-panel">
          <div class="status-row">
            <span class="status-label">Active Country State:</span>
            <span class="status-badge">{data.active_country}</span>
          </div>
          <div class="status-row">
            <span class="status-label">Status Message:</span>
            <span style="color: #38bdf8; font-weight: 600;">{data.status_text}</span>
          </div>
          <div class="status-row">
            <span class="status-label">Total Action Invocations:</span>
            <span style="color: #a7f3d0; font-weight: 700;">{data.click_count}</span>
          </div>
        </div>

        <p style="font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Select a Country via Composed Action:</p>

        <!-- Action Trigger Buttons with Dynamic Class Reactivity -->
        <div class="button-group">
          <button type="button" class="btn {data.active_country == 'TR' ? 'active' : ''}">
            <on_click action="SelectCountryWorkflow">
              <arg name="code">TR</arg>
              <arg name="name">Turkey</arg>
            </on_click>
            🇹🇷 Turkey (TR)
          </button>

          <button type="button" class="btn {data.active_country == 'UK' ? 'active' : ''}">
            <on_click action="SelectCountryWorkflow">
              <arg name="code">UK</arg>
              <arg name="name">United Kingdom</arg>
            </on_click>
            🇬🇧 United Kingdom (UK)
          </button>

          <button type="button" class="btn {data.active_country == 'USA' ? 'active' : ''}">
            <on_click action="SelectCountryWorkflow">
              <arg name="code">USA</arg>
              <arg name="name">United States</arg>
            </on_click>
            🇺🇸 United States (USA)
          </button>

          <button type="button" class="btn {data.active_country == 'JP' ? 'active' : ''}">
            <on_click action="SelectCountryWorkflow">
              <arg name="code">JP</arg>
              <arg name="name">Japan</arg>
            </on_click>
            🇯🇵 Japan (JP)
          </button>

          <button type="button" class="btn {data.active_country == 'DE' ? 'active' : ''}">
            <on_click action="SelectCountryWorkflow">
              <arg name="code">DE</arg>
              <arg name="name">Germany</arg>
            </on_click>
            🇩🇪 Germany (DE)
          </button>
        </div>
      </div>
    </uid_spec>
  </script>

  <!-- Load EUIX Engine -->
  <script src="./dist/EUIXEngine.umd.js?v=0.3.3"></script>
</body>

</html>
