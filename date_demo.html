<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUIX Engine - Declarative Intl & Date Plugin Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- EUIX Engine (Full Bundle with Date Plugin) -->
    <script src="./dist/EUIXEngine.umd.js"></script>
    <script src="./dist/EUIXDevTools.umd.js" data-euix-devtools="open"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-indigo {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.3);
        }
        .glow-emerald {
            box-shadow: 0 0 40px -10px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white pb-16">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 w-full border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="./router_demo.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-indigo-500 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-emerald-500/20">
                    📅
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-white text-base tracking-tight leading-none flex items-center gap-2">
                        EUIX Engine <span class="px-2 py-0.5 text-[10px] bg-emerald-500/10 text-emerald-400 font-bold border border-emerald-500/20 rounded-md">Intl Date Plugin</span>
                    </span>
                    <span class="text-xs text-slate-400 font-medium">Declarative XML Localization, Ranges & Relative Time</span>
                </div>
            </a>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <a href="./chart_demo.html" class="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center gap-1.5 shadow-sm">
                📊 Charts Demo
            </a>
            <a href="./map_demo.html" class="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center gap-1.5 shadow-sm">
                🗺️ Leaflet Map
            </a>
            <a href="./playground.html" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition-all shadow-md shadow-emerald-600/30">
                🎮 Playground
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-8 flex-1">
        
        <!-- Application Mount Container -->
        <div id="app" class="w-full"></div>

        <!-- Declarative XML Specification for EUIX Date Showcase -->
        <script id="euix-app-spec" type="application/xml">
        <uid_spec>
            <!-- 1. Global Date & Intl Configuration -->
            <date_config locale="tr-TR" timezone="Europe/Istanbul" default_format="medium" />

            <!-- 2. Application Reactive State Store -->
            <data_model>
                <state id="currentLocale">tr-TR</state>
                <state id="currentTimeZone">Europe/Istanbul</state>
                <state id="activePreset">medium</state>
                <state id="sampleDate">2026-08-20T14:30:00Z</state>
                <state id="projectStart">2026-08-01T09:00:00Z</state>
                <state id="projectEnd">2026-09-15T18:00:00Z</state>
                <state id="publishedAt">2026-08-20T12:00:00Z</state>
                <state id="calcDays">14</state>
                <state id="calcResult"></state>
                <state id="logs" type="array"></state>
            </data_model>

            <!-- 3. Lifecycle Hooks -->
            <on_mount action="RUN_SCRIPT">
                $data.logs.push({ id: Date.now(), msg: "Date plugin mounted with locale: " + $data.currentLocale, time: new Date().toISOString() });
                $data.calcResult = $date.format($date.add($data.sampleDate, 14, 'days'), 'full', $data.currentLocale, $data.currentTimeZone);
            </on_mount>

            <on_state_change key="currentLocale" action="SET_DATE_LOCALE" locale="{data.currentLocale}" />
            <on_state_change key="currentTimeZone" action="SET_DATE_TIMEZONE" timezone="{data.currentTimeZone}" />

            <!-- 4. Visual Layout (Pure EUIX Declarative Flex Architecture) -->
            <flex direction="column" gap="24" class="w-full">

                <!-- Hero Header Card -->
                <flex direction="column" gap="24" class="glass-panel glow-emerald rounded-2xl p-6 sm:p-8 border border-emerald-500/20 bg-gradient-to-r from-slate-900 via-slate-900 to-emerald-950/40 md:flex-row md:items-center md:justify-between">
                    <flex direction="column" gap="8">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 w-fit text-emerald-400 text-xs font-semibold">
                            ✨ Built-in Native Intl High Performance Formatters
                        </div>
                        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                            Declarative Date & Time Localization
                        </h1>
                        <p class="text-sm text-slate-300 max-w-2xl">
                            Seamlessly parse, format, calculate and render relative times, date ranges, and live ticking timestamps directly in XML templates with zero runtime overhead.
                        </p>
                    </flex>

                    <!-- Live Ticking Clock Badge -->
                    <flex direction="column" align="center" justify="center" class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 shadow-inner min-w-[240px]">
                        <span class="text-xs text-slate-400 font-mono uppercase tracking-wider mb-1">Live UTC / Local Clock</span>
                        <time class="text-xl font-black text-emerald-400 font-mono" value="now" format="time_medium" live="true" interval="1000" />
                        <span class="text-[11px] text-slate-500 mt-1">Updates every 1000ms</span>
                    </flex>
                </flex>

                <!-- Interactive Control Bar -->
                <flex direction="row" justify="between" align="center" class="glass-panel rounded-2xl p-5 border border-slate-800 flex-wrap gap-4">
                    <flex direction="row" align="center" gap="16" class="flex-wrap">
                        <!-- Locale Selector -->
                        <flex direction="row" align="center" gap="8">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Locale (Lang):</label>
                            <select bind="currentLocale" class="bg-slate-900 border border-slate-700 text-white text-xs font-semibold rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer">
                                <option value="tr-TR">🇹🇷 Turkish (tr-TR)</option>
                                <option value="en-US">🇺🇸 English US (en-US)</option>
                                <option value="en-GB">🇬🇧 English UK (en-GB)</option>
                                <option value="de-DE">🇩🇪 German (de-DE)</option>
                                <option value="fr-FR">🇫🇷 French (fr-FR)</option>
                                <option value="ja-JP">🇯🇵 Japanese (ja-JP)</option>
                                <option value="ar-SA">🇸🇦 Arabic (ar-SA)</option>
                            </select>
                        </flex>

                        <!-- TimeZone Selector -->
                        <flex direction="row" align="center" gap="8">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">TimeZone:</label>
                            <select bind="currentTimeZone" class="bg-slate-900 border border-slate-700 text-white text-xs font-semibold rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer">
                                <option value="Europe/Istanbul">Europe/Istanbul (+03:00)</option>
                                <option value="UTC">UTC (+00:00)</option>
                                <option value="America/New_York">America/New_York (EST)</option>
                                <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
                                <option value="Europe/London">Europe/London (GMT/BST)</option>
                                <option value="Europe/Berlin">Europe/Berlin (CET)</option>
                                <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
                            </select>
                        </flex>
                    </flex>

                    <flex direction="row" align="center" gap="8">
                        <button class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 transition-colors cursor-pointer">
                            <on_click action="RUN_SCRIPT">
                                $data.sampleDate = new Date().toISOString();
                                const days = parseInt($data.calcDays || "0", 10);
                                const target = $date.add($data.sampleDate, days, 'days');
                                $data.calcResult = $date.format(target, 'full', $data.currentLocale, $data.currentTimeZone);
                                $data.logs.unshift({ id: Date.now(), msg: "Set sample date to now: " + $date.format($data.sampleDate, 'medium', $data.currentLocale, $data.currentTimeZone), time: new Date().toISOString() });
                            </on_click>
                            ⚡ Set Sample Date to Now
                        </button>
                    </flex>
                </flex>

                <!-- 3-Column Demo Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                    
                    <!-- Card 1: Standard Format Presets -->
                    <flex direction="column" gap="16" class="glass-panel rounded-2xl p-6 border border-slate-800">
                        <flex direction="row" justify="between" align="center" class="border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-white text-base flex items-center gap-2">
                                <span>🏷️</span> Format Presets
                            </h3>
                            <span class="text-[11px] font-mono text-emerald-400">&lt;date format="..."&gt;</span>
                        </flex>

                        <flex direction="column" gap="12" class="text-xs">
                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">short:</span>
                                <date class="font-bold text-white" value="{data.sampleDate}" format="short" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">medium:</span>
                                <date class="font-bold text-white" value="{data.sampleDate}" format="medium" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">long:</span>
                                <date class="font-bold text-white" value="{data.sampleDate}" format="long" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">full:</span>
                                <date class="font-bold text-emerald-400 text-right" value="{data.sampleDate}" format="full" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">weekday:</span>
                                <date class="font-bold text-indigo-400" value="{data.sampleDate}" format="weekday" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">time:</span>
                                <time class="font-bold text-amber-400" value="{data.sampleDate}" format="time" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>
                        </flex>
                    </flex>

                    <!-- Card 2: Relative Time & Date Ranges -->
                    <flex direction="column" gap="16" class="glass-panel rounded-2xl p-6 border border-slate-800">
                        <flex direction="row" justify="between" align="center" class="border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-white text-base flex items-center gap-2">
                                <span>⏱️</span> Relative & Ranges
                            </h3>
                            <span class="text-[11px] font-mono text-cyan-400">&lt;date_range&gt;</span>
                        </flex>

                        <flex direction="column" gap="12" class="text-xs">
                            <flex direction="column" gap="4" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono text-[11px]">Date Range (Project Duration):</span>
                                <date_range class="font-bold text-cyan-300 text-sm mt-0.5" start="{data.projectStart}" end="{data.projectEnd}" format="medium" locale="{data.currentLocale}" timezone="{data.currentTimeZone}" />
                            </flex>

                            <flex direction="column" gap="4" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono text-[11px]">Relative Time (Auto style):</span>
                                <relative_time class="font-bold text-emerald-400 text-sm mt-0.5" value="{data.publishedAt}" locale="{data.currentLocale}" live="true" interval="10000" />
                            </flex>

                            <flex direction="column" gap="4" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono text-[11px]">Future Relative Time (Project End):</span>
                                <relative_time class="font-bold text-purple-400 text-sm mt-0.5" value="{data.projectEnd}" locale="{data.currentLocale}" />
                            </flex>

                            <flex direction="row" align="center" gap="8" class="mt-2">
                                <button class="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 transition-colors cursor-pointer">
                                    <on_click action="RUN_SCRIPT">
                                        $data.publishedAt = new Date(Date.now() - 3600000 * 5).toISOString();
                                        $data.logs.unshift({ id: Date.now(), msg: "Set published date to 5 hours ago", time: new Date().toISOString() });
                                    </on_click>
                                    Set Published: 5 hours ago
                                </button>
                            </flex>
                        </flex>
                    </flex>

                    <!-- Card 3: $date Expression Helper & Calculations -->
                    <flex direction="column" gap="16" class="glass-panel rounded-2xl p-6 border border-slate-800">
                        <flex direction="row" justify="between" align="center" class="border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-white text-base flex items-center gap-2">
                                <span>🧮</span> Math & Script Calculations
                            </h3>
                            <span class="text-[11px] font-mono text-purple-400">$date.add()</span>
                        </flex>

                        <flex direction="column" gap="12" class="text-xs">
                            <flex direction="column" gap="8" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                <label class="text-slate-400 font-mono text-[11px]">Add Days to Sample Date:</label>
                                <flex direction="row" align="center" gap="8">
                                    <input type="number" bind="calcDays" class="bg-slate-950 border border-slate-700 text-white rounded-lg px-2.5 py-1.5 w-20 text-xs font-mono" />
                                    <button class="flex-1 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition-all shadow-md shadow-emerald-600/20 cursor-pointer">
                                        <on_click action="RUN_SCRIPT">
                                            const days = parseInt($data.calcDays || "0", 10);
                                            const target = $date.add($data.sampleDate, days, 'days');
                                            $data.calcResult = $date.format(target, 'full', $data.currentLocale, $data.currentTimeZone);
                                            $data.logs.unshift({ id: Date.now(), msg: "Calculated " + days + " days ahead: " + $data.calcResult, time: new Date().toISOString() });
                                        </on_click>
                                        Calculate
                                    </button>
                                </flex>
                            </flex>

                            <flex direction="column" gap="4" class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono text-[11px]">Calculated Output Date:</span>
                                <span class="font-bold text-amber-300 text-xs mt-0.5 leading-relaxed">{data.calcResult}</span>
                            </flex>

                            <flex direction="row" justify="between" align="center" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-400 font-mono">Month Start / End:</span>
                                <span class="font-mono text-slate-300 text-[11px]">
                                    {$date.format($date.startOf(data.sampleDate, 'month'), 'short', data.currentLocale, data.currentTimeZone)} – {$date.format($date.endOf(data.sampleDate, 'month'), 'short', data.currentLocale, data.currentTimeZone)}
                                </span>
                            </flex>

                            <div class="grid grid-cols-2 gap-2 mt-1">
                                <flex direction="column" class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                    <span class="text-[10px] text-slate-400 font-mono">Days in Month:</span>
                                    <span class="font-bold text-emerald-400 text-xs font-mono">{$date.daysInMonth(data.sampleDate)} days</span>
                                </flex>
                                <flex direction="column" class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                    <span class="text-[10px] text-slate-400 font-mono">Leap Year:</span>
                                    <span class="font-bold text-indigo-400 text-xs font-mono">{$date.isLeapYear(data.sampleDate) ? 'Yes (366d)' : 'No (365d)'}</span>
                                </flex>
                                <flex direction="column" class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                    <span class="text-[10px] text-slate-400 font-mono">Quarter:</span>
                                    <span class="font-bold text-amber-400 text-xs font-mono">Q{$date.quarter(data.sampleDate)}</span>
                                </flex>
                                <flex direction="column" class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                                    <span class="text-[10px] text-slate-400 font-mono">Week of Year:</span>
                                    <span class="font-bold text-cyan-400 text-xs font-mono">Week {$date.weekOfYear(data.sampleDate)}</span>
                                </flex>
                            </div>
                        </flex>
                    </flex>
                </div>

                <!-- Event Logs Audit Panel -->
                <flex direction="column" gap="12" class="glass-panel rounded-2xl p-6 border border-slate-800">
                    <flex direction="row" justify="between" align="center">
                        <h3 class="font-bold text-white text-sm flex items-center gap-2">
                            <span>📜</span> Reactive State & Action Audit Log
                        </h3>
                        <button class="text-xs text-slate-400 hover:text-slate-200 transition-colors cursor-pointer">
                            <on_click action="MUTATE_STATE">
                                <path>logs</path>
                                <operation>CLEAR</operation>
                            </on_click>
                            Clear Logs
                        </button>
                    </flex>

                    <div class="bg-slate-950/80 rounded-xl p-3 border border-slate-800/80 max-h-48 overflow-y-auto flex flex-col gap-2 font-mono text-xs">
                        <for_each items="{data.logs}" var="log" key="id">
                            <flex direction="row" justify="between" align="center" class="text-slate-300 border-b border-slate-900/60 pb-1">
                                <span class="text-emerald-400">⚡ {log.msg}</span>
                                <time class="text-[10px] text-slate-500" value="{log.time}" format="time_medium" />
                            </flex>
                        </for_each>
                    </div>
                </flex>

            </flex>
        </uid_spec>
        </script>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const specXml = document.getElementById("euix-app-spec").textContent;
            const app = EUIXEngine.mount(specXml, document.getElementById("app"));
            console.log("EUIX Date Plugin Demo Mounted successfully!", app);
        });
    </script>
</body>
</html>
