<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EUIX Navigator & Device Plugin Interactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(26, 34, 52, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818cf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b 0%, var(--bg-dark) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 80px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .grid-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 14px;
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .metric-label {
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .btn:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .btn-danger:hover {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
    }

    .input-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .toast-box {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-badge">🌐 euixjs/navigator Plugin</div>
      <h1>Browser & Device Intelligence</h1>
      <p>Declarative access to Network, Battery, Hardware, Geolocation, Clipboard, Vibration & Screen Wake Lock.</p>
    </div>

    <!-- EUIX App Mount Point -->
    <div id="app"></div>
  </div>

  <!-- Load EUIX Full Bundle & DevTools -->
  <script src="./dist/EUIXEngine.umd.js"></script>
  <script src="./dist/plugins/EUIXNavigatorPlugin.umd.js"></script>
  <script src="./dist/EUIXDevTools.umd.js"></script>

  <script>
    const xmlSpec = `
      <uid_spec>
        <!-- 1. Auto-track network, battery and hardware into 'nav' state -->
        <navigator_config 
          bind_target="nav" 
          track_network="true" 
          track_battery="true" 
          track_geolocation="false" 
        />

        <data_model>
          <state id="share_url">https://github.com/litepacks/euix</state>
          <state id="pasted_content">Click Paste below...</state>
          <state id="action_feedback">Ready for interaction</state>
          <state id="badge_count">3</state>
          <state id="user_coords" type="object">{}</state>
        </data_model>

        <flex direction="column" gap="24">
          <!-- TOP 3 STATUS CARDS -->
          <div class="grid-dashboard">
            <!-- 1. Network Card -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">📡 Network Info</span>
                <span class="badge {data.nav.network.online ? 'badge-success' : 'badge-danger'}">
                  {data.nav.network.online ? 'ONLINE' : 'OFFLINE'}
                </span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Effective Type</span>
                <span class="metric-value">{data.nav.network.effectiveType.toUpperCase()}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Downlink Speed</span>
                <span class="metric-value">~{data.nav.network.downlink} Mbps</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Round-Trip Latency (RTT)</span>
                <span class="metric-value">{data.nav.network.rtt} ms</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Data Saver Active</span>
                <span class="metric-value">{data.nav.network.saveData ? 'Yes' : 'No'}</span>
              </div>
            </div>

            <!-- 2. Battery & Power Card -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">🔋 Battery &amp; Power</span>
                <span class="badge badge-info">
                  {data.nav.battery ? data.nav.battery.level + '%' : '100%'}
                </span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Power Source</span>
                <span class="metric-value">{data.nav.battery.charging ? 'Charging ⚡' : 'On Battery 🔋'}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Battery Level</span>
                <span class="metric-value">{data.nav.battery ? data.nav.battery.level + '%' : 'N/A'}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Discharging Time</span>
                <span class="metric-value">{data.nav.battery ? (data.nav.battery.dischargingTime === Infinity ? 'Infinite' : data.nav.battery.dischargingTime + 's') : 'N/A'}</span>
              </div>
            </div>

            <!-- 3. Hardware & Specs Card -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">💻 Device Specs</span>
                <span class="badge badge-info">{data.nav.hardware.language}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Logical CPU Cores</span>
                <span class="metric-value">{data.nav.hardware.cores} Cores</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Device Memory (RAM)</span>
                <span class="metric-value">~{data.nav.hardware.memory} GB</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Touch Screen</span>
                <span class="metric-value">{data.nav.hardware.touch ? 'Supported 👆' : 'No Touch 🖱️'}</span>
              </div>
            </div>
          </div>

          <!-- INTERACTIVE ACTION PLAYGROUND CARDS -->
          <div class="grid-dashboard">
            <!-- Card 4: Clipboard Actions -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">📋 Clipboard Engine</span>
              </div>
              <input bind="share_url" class="input-box" placeholder="URL or text to copy" />
              <div class="btn-group">
                <button class="btn">
                  <on_click action="CLIPBOARD_COPY">
                    <text>{data.share_url}</text>
                  </on_click>
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Copied text to clipboard!'</value>
                  </on_click>
                  Copy URL
                </button>
                <button class="btn btn-secondary">
                  <on_click action="CLIPBOARD_READ" target="pasted_content" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Read from clipboard!'</value>
                  </on_click>
                  Paste Text
                </button>
              </div>
              <div class="toast-box" style="margin-top: 14px;">
                <strong>Pasted:</strong> {data.pasted_content}
              </div>
            </div>

            <!-- Card 5: Share, Vibrate & WakeLock -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">⚡ Haptics &amp; System</span>
              </div>
              <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 14px;">
                Trigger native mobile vibrations, wake lock or open system share dialog:
              </p>
              <div class="btn-group">
                <button class="btn">
                  <on_click action="VIBRATE" pattern="[60, 40, 60]" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Vibrated device (60ms buzz)'</value>
                  </on_click>
                  📳 Vibrate
                </button>
                <button class="btn btn-secondary">
                  <on_click action="WEB_SHARE">
                    <title>EUIX Framework</title>
                    <text>Ultra-fast XML reactive framework</text>
                    <url>https://github.com/litepacks/euix</url>
                  </on_click>
                  🚀 Native Share
                </button>
                <button class="btn btn-secondary">
                  <on_click action="WAKE_LOCK" type="request" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Screen Wake Lock Requested'</value>
                  </on_click>
                  ☀️ Keep Screen Awake
                </button>
              </div>
            </div>

            <!-- Card 6: Geolocation & Badging -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">📍 GPS &amp; Tab Badge</span>
              </div>
              <div class="btn-group">
                <button class="btn">
                  <on_click action="GET_GEOLOCATION" target="user_coords" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'GPS Coordinates Updated'</value>
                  </on_click>
                  📍 Locate Me
                </button>
                <button class="btn btn-secondary">
                  <on_click action="SET_APP_BADGE" count="{data.badge_count}" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Set App Badge to ' + {data.badge_count}</value>
                  </on_click>
                  Set Badge ({data.badge_count})
                </button>
                <button class="btn btn-danger">
                  <on_click action="CLEAR_APP_BADGE" />
                  <on_click action="SET_STATE">
                    <path>data.action_feedback</path>
                    <value>'Cleared App Badge'</value>
                  </on_click>
                  Clear Badge
                </button>
              </div>
              <div class="toast-box" style="margin-top: 14px;">
                <strong>GPS:</strong> Lat: {data.user_coords.latitude || 'N/A'}, Lng: {data.user_coords.longitude || 'N/A'}
              </div>
            </div>
          </div>

          <!-- Bottom Live Action Feedback Banner -->
          <div class="card" style="background: rgba(15, 23, 42, 0.85); border-color: rgba(56, 189, 248, 0.4);">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 14px; font-weight: 600; color: var(--primary);">⚡ Live Action Status:</span>
              <span style="font-size: 14px; font-weight: 700; color: #fff;">{data.action_feedback}</span>
            </div>
          </div>
        </flex>
      </uid_spec>
    `;

    // Mount specification to #app
    const engine = EUIXEngine.mount(xmlSpec, document.getElementById('app'));

    // Initialize Standalone DevTools Inspector
    if (window.EUIXDevTools) {
      EUIXDevTools.init(engine);
    }
  </script>
</body>
</html>
