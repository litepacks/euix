name: EUIX Engine CI & Release Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * *" # Nightly stress & soak run

jobs:
  pr_validation:
    name: PR Validation & Battle Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Build & Test Tooling (Vite, Vitest, Biome)
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            ~/.cache/biome
          key: ${{ runner.os }}-tooling-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-tooling-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-tooling-

      - name: Build Bundles
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Battle Test Suite (Property, Fuzz, Roundtrip, Permutations, Chaos)
        run: npm run test:battle

      - name: Package Artifact Smoke Test
        run: npm run test:package

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright E2E Matrix (Chromium, Firefox, WebKit)
        run: npm run test:browser

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            test-results/
            playwright-report/

  nightly_soak_mutation:
    name: Nightly Soak & Mutation Testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Stryker Mutation Testing
        uses: actions/cache@v4
        with:
          path: |
            .stryker-tmp
            reports/mutation
            node_modules/.cache
          key: ${{ runner.os }}-stryker-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-stryker-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-stryker-

      - name: Run 5-Minute Soak Test
        run: SOAK_DURATION_MIN=5 npm run test:soak

      - name: Run StrykerJS Mutation Testing
        run: npm run test:mutation
