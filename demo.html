<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUIX Engine Advanced Demo - Live Crypto Portfolio</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50/70 min-h-screen py-12 px-4 flex flex-col items-center justify-start">
    <div id="app" class="w-full max-w-2xl"></div>

    <!-- EUIX XML Specification (Auto-Init) -->
    <script type="application/euix" target="#app">
    <uid_spec id="advanced_crypto_demo">
        <constants>
            <const id="card_box">w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100</const>
        </constants>

        <imports>
            <import name="app-header" src="./components/AppHeader.xml" />
            <import name="crypto-portfolio-section" src="./components/CryptoPortfolioSection.xml" />
            <import name="countdown-section" src="./components/CountdownSection.xml" />
            <import name="api-client-section" src="./components/ApiClientSection.xml" />
            <import name="confirm-modal" src="./components/ConfirmModal.xml" />
        </imports>

        <flex direction="column" gap="16" class="{const.card_box}">
            <app-header />
            
            <!-- Advanced Crypto Portfolio & Live Ticker Component -->
            <crypto-portfolio-section />

            <!-- Live Countdown Timer Component -->
            <countdown-section />

            <!-- Declarative API Client Component -->
            <api-client-section />
        </flex>
    </uid_spec>
    </script>

    <!-- Load EUIX Engine & DevTools -->
    <script type="module" src="./src/EUIXEngine.js"></script>
    <script type="module" src="./src/EUIXDevTools.js" data-euix-devtools></script>
</body>

</html>
