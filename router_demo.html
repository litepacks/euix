<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUIX Engine - Web Router Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-glass: rgba(15, 23, 42, 0.85);
            --border-color: rgba(148, 163, 184, 0.15);
            --border-hover: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: env(safe-area-inset-bottom);
        }

        header.app-header {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .logo-box:hover {
            opacity: 0.85;
        }

        .logo-badge {
            background: var(--accent-gradient);
            color: white;
            font-weight: 800;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .logo-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .header-links::-webkit-scrollbar {
            display: none;
        }

        .header-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        .header-links a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .app-container {
            display: grid;
            grid-template-columns: 260px 1fr 320px;
            min-height: calc(100vh - 65px);
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            transition: all 0.3s ease;
        }

        aside.sidebar {
            background: rgba(15, 23, 42, 0.4);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            min-height: 44px;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .nav-links a.active {
            color: #fff;
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.35);
            font-weight: 600;
        }

        main.content-view {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 10px;
            line-height: 1.25;
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .input-text {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s ease;
            min-height: 44px;
        }

        .input-text:focus {
            border-color: var(--accent-primary);
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tabs a {
            padding: 10px 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            white-space: nowrap;
            transition: all 0.2s;
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        .tabs a.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
            font-weight: 600;
        }

        aside.inspect-panel {
            background: rgba(15, 23, 42, 0.75);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow-y: auto;
        }

        .inspect-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        pre.code-block {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            color: #a5b4fc;
            overflow-x: auto;
            line-height: 1.5;
        }

        /* Mobile Bottom Tab Bar */
        .mobile-bottom-nav {
            display: none;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1023px) {
            .app-container {
                grid-template-columns: 1fr;
                padding-bottom: 72px; /* Space for mobile tab bar */
            }

            aside.sidebar {
                display: none; /* Replaced by bottom bar on mobile */
            }

            main.content-view {
                padding: 16px;
            }

            aside.inspect-panel {
                border-left: none;
                border-top: 1px solid var(--border-color);
                padding: 16px;
                background: rgba(15, 23, 42, 0.95);
            }

            .mobile-bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--bg-glass);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-top: 1px solid var(--border-color);
                z-index: 200;
                justify-content: space-around;
                align-items: center;
                padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            }

            .mobile-bottom-nav a {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                color: var(--text-muted);
                text-decoration: none;
                font-size: 11px;
                font-weight: 600;
                padding: 6px 12px;
                border-radius: var(--radius-sm);
                transition: all 0.2s ease;
                min-width: 64px;
            }

            .mobile-bottom-nav a .nav-icon {
                font-size: 18px;
            }

            .mobile-bottom-nav a:hover,
            .mobile-bottom-nav a.active {
                color: #fff;
                background: rgba(99, 102, 241, 0.15);
            }

            .mobile-bottom-nav a.active .nav-icon {
                transform: scale(1.1);
            }

            .project-list-card {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 12px;
            }

            .project-list-card .btn {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 20px;
            }

            .logo-title {
                display: none;
            }

            .header-links {
                max-width: 220px;
            }

            .card {
                padding: 16px;
                border-radius: var(--radius-sm);
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="#/" class="logo-box">
            <span class="logo-badge">EUIX</span>
            <span class="logo-title">Web Router Engine</span>
        </a>
        <div class="header-links">
            <a href="./chart_demo.html">📊 Charts</a>
            <a href="./playground.html">🎮 Playground</a>
            <a href="./map_demo.html">🗺️ Maps</a>
            <a href="./index.html">📖 Docs</a>
        </div>
    </header>

    <div id="app"></div>

    <div id="app"></div>

    <script type="module">
        import { EUIXEngineCore } from "./src/core/EUIXEngineCore.js";
        import { EUIXRouterPlugin } from "./src/plugins/EUIXRouterPlugin.js";

        EUIXEngineCore.use(EUIXRouterPlugin);

        const xmlApp = `
        <uid_spec>
            <router mode="hash" base="/">
                <route id="root" path="/" layout="app-shell">
                    <index id="home" component="home-view" />

                    <route id="projects" path="projects" layout="projects-layout" loader="loadProjects">
                        <index component="projects-list-view" />
                        <route id="project-detail" path=":projectId" layout="project-detail-layout" loader="loadProjectDetail" action="saveProjectAction">
                            <index component="project-overview-tab" />
                            <route id="project-tasks" path="tasks" component="project-tasks-tab" />
                            <route id="project-settings" path="settings" component="project-settings-tab" />
                        </route>
                    </route>

                    <route id="about" path="about" component="about-view" />
                    <route id="not-found" path="*" component="not-found-view" />
                </route>
            </router>

            <!-- App Layout Shell -->
            <component_def name="app-shell">
                <div class="app-container">
                    <aside class="sidebar">
                        <div>
                            <div class="sidebar-section-title">Navigation</div>
                            <nav class="nav-links">
                                <route-link to="/" exact="true">⚡ Home</route-link>
                                <route-link to="/projects">📁 Projects</route-link>
                                <route-link to="/about">ℹ️ About</route-link>
                            </nav>
                        </div>
                        <div>
                            <div class="sidebar-section-title">Quick Links</div>
                            <nav class="nav-links">
                                <route-link to="/projects/1">🔹 Next-Gen Engine</route-link>
                                <route-link to="/projects/2">🔸 Spatial Studio</route-link>
                            </nav>
                        </div>
                    </aside>

                    <main class="content-view">
                        <outlet />
                    </main>

                    <aside class="inspect-panel">
                        <div class="inspect-header">
                            <span>$route Live State</span>
                            <span style="color: var(--success);">● SYNC</span>
                        </div>
                        <div class="code-block" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px;">
                            <div><span style="color: #818cf8;">Pathname:</span> {$route.pathname}</div>
                            <div><span style="color: #818cf8;">Route ID:</span> {$route.id}</div>
                            <div><span style="color: #818cf8;">ProjectId:</span> {$route.params.projectId}</div>
                            <div><span style="color: #818cf8;">Title:</span> {$route.data.title}</div>
                            <div><span style="color: #818cf8;">Nav State:</span> {$router.navigation.state}</div>
                        </div>
                        <pre class="code-block" style="margin-top: 10px; font-size: 11px; max-height: 260px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;">{JSON.stringify($route, null, 2)}</pre>
                    </aside>

                    <!-- Mobile Bottom Tab Bar -->
                    <nav class="mobile-bottom-nav">
                        <route-link to="/" exact="true">
                            <span class="nav-icon">⚡</span>
                            <span>Home</span>
                        </route-link>
                        <route-link to="/projects">
                            <span class="nav-icon">📁</span>
                            <span>Projects</span>
                        </route-link>
                        <route-link to="/about">
                            <span class="nav-icon">ℹ️</span>
                            <span>About</span>
                        </route-link>
                    </nav>
                </div>
            </component_def>

            <!-- Home View -->
            <component_def name="home-view">
                <div class="card">
                    <h1>🚀 Welcome to EUIX Router</h1>
                    <p>
                        A lightweight, buildless Web Router that provides React Router-equivalent capabilities directly in browser XML specs.
                    </p>
                    <div style="display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap;">
                        <route-link to="/projects" class="btn">Explore Projects →</route-link>
                        <route-link to="/about" class="btn btn-secondary">Learn Architecture</route-link>
                    </div>
                </div>
            </component_def>

            <!-- Projects Layout -->
            <component_def name="projects-layout">
                <div class="card">
                    <outlet />
                </div>
            </component_def>

            <!-- Projects List View -->
            <component_def name="projects-list-view">
                <div>
                    <h1>📁 Project Directory</h1>
                    <p>Select a project below to experience nested route layout preservation.</p>

                    <div style="display: grid; gap: 16px; margin-top: 20px;">
                        <for_each items="{$route.data}" var="p">
                            <div class="card project-list-card" style="margin: 0; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 style="margin-bottom: 4px;">{p.title}</h3>
                                    <span style="font-size: 13px; color: var(--text-muted);">{p.category}</span>
                                </div>
                                <route-link to="/projects/{p.id}" class="btn btn-secondary">View Project</route-link>
                            </div>
                        </for_each>
                    </div>
                </div>
            </component_def>

            <!-- Project Detail Layout -->
            <component_def name="project-detail-layout">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <div>
                            <route-link to="/projects" style="font-size: 13px; color: var(--accent-primary); text-decoration: none;">← Back to Projects</route-link>
                            <h1 style="margin-top: 8px;">{$route.data.title}</h1>
                        </div>
                    </div>

                    <div class="tabs">
                        <route-link to="/projects/{$route.params.projectId}" exact="true">Overview</route-link>
                        <route-link to="/projects/{$route.params.projectId}/tasks">Tasks</route-link>
                        <route-link to="/projects/{$route.params.projectId}/settings">Settings</route-link>
                    </div>

                    <outlet />
                </div>
            </component_def>

            <!-- Project Tabs -->
            <component_def name="project-overview-tab">
                <div>
                    <p>{$route.data.description}</p>
                    <div style="margin-top: 16px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: var(--radius-sm);">
                        <strong>Stars:</strong> {$route.data.stars}
                    </div>
                </div>
            </component_def>

            <component_def name="project-tasks-tab">
                <div>
                    <h3>Active Tasks</h3>
                    <p style="margin-top: 8px;">Nested tab outlet loaded seamlessly without remounting parent project layout!</p>
                </div>
            </component_def>

            <component_def name="project-settings-tab">
                <div>
                    <h3>Project Settings</h3>
                    <route-form method="post">
                        <div style="margin: 16px 0;">
                            <label style="display: block; font-size: 13px; margin-bottom: 6px;">Project Title</label>
                            <input name="title" class="input-text" value="{$route.data.title}" />
                        </div>
                        <button class="btn" disabled="{$router.navigation.state === 'submitting'}">
                            {$router.navigation.state === 'submitting' ? 'Saving...' : 'Save Changes'}
                        </button>
                    </route-form>
                </div>
            </component_def>

            <!-- About View -->
            <component_def name="about-view">
                <div class="card">
                    <h1>ℹ️ About EUIX Router</h1>
                    <p>
                        Engineered around web platform primitives: History API, URLSearchParams, AbortController, and fine-grained EUIX reactive models.
                    </p>
                </div>
            </component_def>

            <!-- 404 View -->
            <component_def name="not-found-view">
                <div class="card" style="text-align: center; padding: 48px 24px;">
                    <h1>404 - Route Not Found</h1>
                    <p>The requested route does not exist.</p>
                    <route-link to="/" class="btn" style="margin-top: 16px;">Go Home</route-link>
                </div>
            </component_def>

            <outlet />
        </uid_spec>
        `;

        // Register Data Loaders & Actions on Plugin
        EUIXRouterPlugin.loader("loadProjects", async () => {
            return [
                { id: "1", title: "Next-Gen UI Engine", category: "Core Framework", description: "Ultra-fast XML reactive engine." },
                { id: "2", title: "Spatial Leaflet Studio", category: "Geospatial", description: "Interactive vector maps & polygons." },
                { id: "3", title: "Resilient API Pipeline", category: "Networking", description: "Auto-retry and circuit-breaker client." }
            ];
        });

        const projectsStore = {
            "1": { id: "1", title: "Next-Gen UI Engine", stars: 256, description: "Ultra-fast XML reactive UI runtime with zero VDOM overhead." },
            "2": { id: "2", title: "Spatial Leaflet Studio", stars: 184, description: "Declarative maps with real-time polygon area calculations." },
            "3": { id: "3", title: "Resilient API Pipeline", stars: 92, description: "Self-healing network client with exponential backoff." }
        };

        EUIXRouterPlugin.loader("loadProjectDetail", async ({ params }) => {
            return projectsStore[params.projectId] || { id: params.projectId, title: `Project ${params.projectId}`, stars: 0, description: "Custom project." };
        });

        EUIXRouterPlugin.action("saveProjectAction", async ({ params, formData }) => {
            const newTitle = formData.get("title");
            if (projectsStore[params.projectId]) {
                projectsStore[params.projectId].title = newTitle;
            }
            return { success: true };
        });

        const engine = EUIXEngineCore.mount(xmlApp, document.getElementById("app"));
    </script>
</body>
</html>
