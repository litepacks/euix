<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUIX Engine - Interactive Demo Playground</title>
    <!-- Tailwind CSS (CDN for quick Demo styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Highlight.js CDN for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50/70 min-h-screen py-3 px-2 sm:py-6 sm:px-4 md:px-6 flex flex-col items-center justify-start max-w-full overflow-x-hidden">
    <div id="app" class="w-full max-w-6xl xl:max-w-7xl min-w-0 overflow-hidden"></div>

    <!-- EUIX Şablonu (Playground Auto-Init) -->
    <script type="application/euix" target="#app">
    <uid_spec id="playground_app">
        <constants src="./public/data/app-tokens.json">
            <const id="card_box">w-full bg-white p-6 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100</const>
            <const id="btn_primary">px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-colors cursor-pointer</const>
            <const id="badge_blue">px-2.5 py-1 bg-blue-50 text-blue-700 font-semibold rounded-lg text-xs</const>
        </constants>

        <data_model src="./public/data/app-config.json">
            <state id="new_todo_input" type="string"></state>
            <state id="edit_todo_input" type="string"></state>
            <state id="editing_id" type="string"></state>
            <state id="todos" type="array">
                <item id="1" text="Task 1" completed="false" />
                <item id="2" text="Task 2" completed="false" />
                <item id="3" text="Task 3" completed="true" />
                <item id="4" text="Task 4" completed="false" />
                <item id="5" text="Task 5" completed="false" />
            </state>
            <state id="pokemons" type="array"></state>
            <state id="pokemon_loading" type="string">false</state>
            <state id="pokemon_error" type="string"></state>
            <state id="pokemon_open" type="string">true</state>
            <state id="posts" type="array"></state>
            <state id="posts_loading" type="string">false</state>
            <state id="posts_error" type="string"></state>
            <state id="posts_open" type="string">true</state>
            <state id="new_post_title" type="string"></state>
            <state id="new_post_body" type="string"></state>
            <state id="todos_open" type="string">true</state>
            <state id="events_open" type="string">true</state>
            <state id="form_open" type="string">true</state>
            <state id="quick_todo_input" type="string"></state>
            <state id="hover_status" type="string">Hover over this box...</state>
            <state id="help_open" type="string">false</state>
            <state id="form_bio" type="string">Vanilla .EUIX Engine developer.</state>
            <state id="form_category" type="string">frontend</state>
            <state id="form_level" type="string">senior</state>
            <state id="form_salary" type="string">85</state>
            <state id="form_hours" type="string">40</state>
            <state id="form_email" type="string"></state>
            <state id="form_username" type="string"></state>
            <state id="form_status" type="string">Please complete required fields...</state>
            <state id="dyn_placeholder" type="string">Type search query here...</state>
            <state id="is_btn_disabled" type="string">false</state>
            <state id="confirm_modal_open" type="string">false</state>
            <state id="delete_modal_open" type="string">false</state>
            <state id="selected_todo_id" type="string"></state>
            <state id="counter_value" type="string">0</state>
            <state id="counter_open" type="string">true</state>
            <state id="state_log" type="string">No state changes yet...</state>
            <state id="table_open" type="string">true</state>
            <state id="new_emp_name" type="string"></state>
            <state id="new_emp_role" type="string"></state>
            <state id="new_emp_dept" type="string"></state>
            <state id="code_modal_open" type="string">false</state>
            <state id="code_modal_title" type="string"></state>
            <state id="code_modal_lines" type="string"></state>
            <state id="code_modal_content" type="string"></state>
            <state id="employees" type="array">
                <item name="Ahmet Yilmaz" role="Lead Architect" dept="Core Engine" status="Active" />
                <item name="Zeynep Kaya" role="Senior Frontend Engineer" dept="UI/UX" status="Active" />
                <item name="Can Demir" role="DevOps Lead" dept="Infrastructure" status="Active" />
            </state>
            <state id="composer_open" type="string">true</state>
            <state id="composer_status" type="string">Ready</state>
            <state id="composer_tasks" type="array"></state>
            <state id="action_logs" type="array"></state>
            <state id="last_notification" type="string">None</state>
            <state id="virtual_list_open" type="string">true</state>
            <state id="virtual_items" type="array"></state>
            <state id="virtual_render_time" type="string">0.00</state>
        </data_model>

        <!-- Declarative State Change Hook Example -->
        <on_state_change watch="data.counter_value" action="SET_STATE">
            <path>data.state_log</path>
            <value>State Watcher: Counter updated to {data.counter_value}</value>
        </on_state_change>

        <on_mount action="XHR">
            <method>GET</method>
            <url>https://pokeapi.co/api/v2/pokemon?limit=12</url>
            <select>results</select>
            <target>data.pokemons</target>
            <loading>data.pokemon_loading</loading>
            <error>data.pokemon_error</error>
            <item_map>
                <field as="id" from="url" match="/(\d+)\/?$/" />
                <field as="name" from="name" />
                <field as="image" template="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png" />
            </item_map>
        </on_mount>

        <on_mount action="XHR">
            <method>GET</method>
            <url>https://jsonplaceholder.typicode.com/posts?_limit=4</url>
            <target>data.posts</target>
            <loading>data.posts_loading</loading>
            <error>data.posts_error</error>
        </on_mount>

        <imports>
            <import name="user-badge" src="components/UserBadge.xml" />
            <import name="app-header" src="components/AppHeader.xml" />
            <import name="reactive-section" src="components/ReactiveSection.xml" />
            <import name="animation-section" src="components/AnimationSection.xml" />
            <import name="counter-section" src="components/CounterSection.xml" />
            <import name="state-bridge-badge" src="components/StateBridgeBadge.xml" />
            <import name="todo-section" src="components/TodoSection.xml" />
            <import name="pokemon-card" src="components/PokemonCard.xml" />
            <import name="pokemon-section" src="components/PokemonSection.xml" />
            <import name="posts-crud-section" src="components/PostsCrudSection.xml" />
            <import name="events-section" src="components/EventsSection.xml" />
            <import name="form-section" src="components/FormSection.xml" />
            <import name="confirm-modal" src="components/ConfirmModal.xml" />
            <import name="persistence-section" src="components/PersistenceSection.xml" />
            <import name="api-client-section" src="components/ApiClientSection.xml" />
            <import name="countdown-section" src="components/CountdownSection.xml" />
            <import name="crypto-portfolio-section" src="components/CryptoPortfolioSection.xml" />
            <import name="table-section" src="components/TableSection.xml" />
            <import name="kanban-section" src="components/KanbanSection.xml" />
            <import name="ecommerce-section" src="components/EcommerceSection.xml" />
            <import name="action-composer-section" src="components/ActionComposerSection.xml" />
            <import name="virtual-list-section" src="components/VirtualListSection.xml" />
            <import name="help-modal" src="components/HelpModal.xml" />
            <import name="code-viewer-modal" src="components/CodeViewerModal.xml" />
        </imports>

        <flex direction="column" gap="20" class="w-full">
            <!-- Navigation Header Card -->
            <flex class="p-4 sm:p-6 bg-slate-900 text-white rounded-2xl border border-slate-800 shadow-xl flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between min-w-0 w-full">
                <flex direction="column" gap="4" class="min-w-0">
                    <flex direction="row" align="center" gap="8" class="flex-wrap">
                        <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 font-extrabold text-xs rounded-full border border-emerald-500/30 uppercase tracking-wider">🎮 Live Playground</span>
                        <span class="px-2.5 py-1 bg-blue-500/20 text-blue-300 font-extrabold text-xs rounded-full border border-blue-500/30 uppercase tracking-wider">⚡ AST Caching &amp; Batching Active</span>
                        <span class="text-xs text-slate-400 font-medium hidden sm:inline-block">14 Interactive Component Suites</span>
                    </flex>
                    <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">EUIX Engine Interactive Demos</h1>
                    <p class="text-xs text-slate-300">Explore real-world full-stack components built 100% with Vanilla .EUIX Engine.</p>
                </flex>
                <flex direction="row" gap="8" class="shrink-0 self-start sm:self-auto flex-wrap">
                    <a href="./router_demo.html" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-purple-600/30 flex items-center gap-2 cursor-pointer">
                        🧭 Web Router Demo
                    </a>
                    <a href="./navigator_demo.html" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-sky-600/30 flex items-center gap-2 cursor-pointer">
                        🌐 Device / Navigator Demo
                    </a>
                    <a href="./map_demo.html" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-emerald-600/30 flex items-center gap-2 cursor-pointer">
                        🗺️ Field Notebook (Leaflet Demo)
                    </a>
                    <a href="./index.html" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-2 cursor-pointer">
                        ← Docs
                    </a>
                </flex>
            </flex>

            <!-- External JSON Hydrated Banner Box -->
            <flex class="p-3 sm:p-4 bg-gradient-to-r from-indigo-50 to-blue-50 border border-indigo-100 rounded-xl flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center w-full min-w-0">
                <flex class="flex flex-row items-center gap-3 sm:gap-4 min-w-0 max-w-full">
                    <span class="text-xl sm:text-2xl shrink-0">⚡</span>
                    <flex direction="column" class="min-w-0">
                        <span class="text-xs font-bold text-indigo-950 break-words">{data.banner_message}</span>
                        <span class="text-[11px] text-indigo-600 font-medium break-words">Server: {data.server_location} | Core Version: {data.system_version}</span>
                    </flex>
                </flex>
                <span class="{const.status_badge} shrink-0 self-start sm:self-auto">{data.portal_status}</span>
            </flex>

            <reactive-section />
            <animation-section />
            <action-composer-section />
            <ecommerce-section />
            <virtual-list-section />
            <kanban-section />
            <crypto-portfolio-section />
            <table-section />
            <counter-section />
            <countdown-section />
            <persistence-section />
            <api-client-section />
            <state-bridge-badge count="{data.counter_value}" />

            <!-- State Watcher Live Banner Box -->
            <flex direction="row" align="center" gap="8" class="p-3 bg-amber-50 border border-amber-200/60 rounded-xl text-amber-800 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span>{data.state_log}</span>
            </flex>

            <todo-section />
            <posts-crud-section />
            <pokemon-section />
            <form-section />
            <events-section />
            <confirm-modal bind="data.confirm_modal_open" mode="clear" title="Clear All Tasks?" message="Are you sure you want to permanently delete all tasks?" confirm_text="Yes, Delete All" cancel_text="Cancel" />
            <confirm-modal bind="data.delete_modal_open" mode="remove" title="Delete Task?" message="Are you sure you want to remove this task?" confirm_text="Yes, Delete" cancel_text="Cancel" />
            <help-modal />
            <code-viewer-modal />
        </flex>
    </uid_spec>
    </script>

    <!-- EUIX Engine & DevTools Script (Auto-Init & Inspector) -->
    <script type="module" src="./src/EUIXEngine.js"></script>
    <script type="module">
        import { EUIXEngine } from './src/EUIXEngine.js';
        import { EUIXDevTools } from './src/EUIXDevTools.js';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.EUIXEngine && window.EUIXEngine.instance) {
                const engine = window.EUIXEngine.instance;
                EUIXDevTools.init(engine);

                // JS Programmatic State Watcher Example
                engine.watch('counter_value', (newValue, oldValue) => {
                    console.log(`[JS State Watcher] counter_value updated: ${oldValue} -> ${newValue}`);
                });
            }
        });
    </script>
</body>

</html>
